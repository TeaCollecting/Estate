 if(P)h+=R('දින ගණන',c.d.toFixed(1))+R('මූලික වැටුප',f(c.basic))+R('දිනකට ගෙවන දීමනාව',f(c.da))+R('මාසික දීමනා එකතුව',f(c.ma))+R('මුළු වැටුප',f(c.tot),1)+H('අඩු කිරීම්')+R('අත්තිකාරම්',f(c.a))+R('උත්සව අත්තිකාරම්',fa)+R('සේ. අ. අ. '+S.set.epf+'%',f(c.epf))+R('අඩු කිරීම් එකතුව',f(c.ded),1)+H('තේ දළු')+R('ප්‍රමාණය','-')+R('මුදල','-')+R('ශුද්ධ වැටුප',f(c.net),1);
 else h+=R('කිලෝ ගණන',f(c.k))+R('මුළු වැටුප',f(c.tot),1)+H('අඩු කිරීම්')+R('අත්තිකාරම්',f(c.a))+R('උත්සව අත්තිකාරම්',fa)+R('අඩු කිරීම් එකතුව',f(c.ded),1)+R('ශුද්ධ වැටුප',f(c.net),1);
 return h+'</table></div>'}
function slipx(no){$('slipc').className='rep';$('pg').textContent='@page{size:A4 portrait}';$('slipc').innerHTML=slipBody(no);$('modal').style.display='flex'}
function rep(t){const m=$('slipc');m.className='rep';$('modal').style.display='flex';
 const by=(a,b)=>a.no-b.no;
 if(t=='A'){$('pg').textContent='@page{size:A4 portrait}';m.innerHTML=[...S.w.filter(x=>x.t=='P').sort(by),...S.w.filter(x=>x.t=='C').sort(by)].map(x=>slipBody(x.no)).join('');return}
 $('pg').textContent='@page{size:A4 landscape}';
 const P=t=='P',ws=S.w.filter(x=>x.t==t).sort(by),hd=P?['අංකය','නම','දින ගණන','මූලික වැටුප','දිනකට ගෙවන දීමනාව','මාසික දීමනා','මුළු වැටුප','අත්තිකාරම්','උත්සව අත්තිකාරම්',S.set.epf+'%','මුළු අඩුකිරීම්','ශුද්ධ වැටුප','අත්සන']:['අංකය','නම','කිලෝ ගණන','මුළු වැටුප','අත්තිකාරම්','උත්සව අත්තිකාරම්','මුළු අඩුකිරීම්','ශුද්ධ වැටුප','අත්සන'];
 const fmt=(i,v)=>P&&i==0?v.toFixed(1):(!P&&i==3&&!v)?'-':f(v),tot=[];
 const rows=ws.map(x=>{const r=rec(x.no),c=P?calcP(r):calcC(r),n=P?[c.d,c.basic,c.da,c.ma,c.tot,c.a,c.fa,c.epf,c.ded,c.net]:[c.k,c.tot,c.a,c.fa,c.ded,c.net];n.forEach((v,i)=>tot[i]=(tot[i]||0)+v);
  return `<tr><td>${x.no}<td style='text-align:left'>${x.name}${n.map((v,i)=>`<td>${fmt(i,v)}`).join('')}<td style='width:90px'></tr>`}).join('');
 m.innerHTML=`${hdr()}<h3>${yr.value} ${MN[mo.value]} මස<br>${P?'ස්ථිර':'අනියම්'} සේවක වැටුප් ගෙවීම් ලේඛනය</h3><table><thead><tr>${hd.map(h=>`<th>${h}`).join('')}</tr></thead><tbody>${rows}<tr style='font-weight:700'><td colspan=2>එකතුව${tot.map((v,i)=>`<td>${fmt(i,v)}`).join('')}<td></tr></tbody></table>`}
/* ---- supervisor (daily kg cards) ---- */
function svdate(v){if(!v)return;DD=v;yr.value=v.slice(0,4);mo.value=+v.slice(5,7)-1;subE();svrender()}
function svday(n){const t=new Date(DD+'T00:00');t.setDate(t.getDate()+n);svdate(t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate()))}
function svrender(){const el=ROLE=='admin'?$('main'):$('sv'),wrap=ROLE=='admin'?'':"style='max-width:520px;margin:10px auto'";
 el.innerHTML=`<div class=card ${wrap}><b>දෛනික කිලෝ සටහන</b><div class=dnav><button class=o onclick='svday(-1)' aria-label='පෙර දිනය'>‹</button><input type=date value='${DD}' onchange='svdate(this.value)'><button class=o onclick='svday(1)' aria-label='ඊළඟ දිනය'>›</button></div><div class=dsum id=dsum></div><input id=sq placeholder='🔍 සේවක අංකය හෝ නම...' oninput='svq(this.value)' value='${Q}' style='width:100%;padding:12px;font-size:16px'><div id=sent></div><div id=sres class=cg></div></div>`;svres();svent()}
function svres(){const e=$('sres');if(!e)return;const ws=[...S.w].sort((a,b)=>a.no-b.no),d=+DD.slice(8),q=Q.trim(),dv=w=>+(rec(w.no).dk||{})[d]||0,n=ws.filter(w=>dv(w)>0).length;
 $('dsum').innerHTML=`<div><b>${f(ws.reduce((a,w)=>a+dv(w),0))}</b><span>අද මුළු kg</span></div><div><b>${n}/${ws.length}</b><span>සටහන් කළා</span></div><div><b>${f(ws.reduce((a,w)=>a+ksum(rec(w.no)),0))}</b><span>මාසික kg</span></div>`;
 const l=q?ws.filter(w=>String(w.no).startsWith(q)||w.name.split(/\s+/).some(p=>p.startsWith(q))):ws;
 e.innerHTML=l.map(w=>{const v=dv(w);return `<div class="wc${v?' dn':''}${w.no==SW?' sel':''}" role=button tabindex=0 onclick='svpick(${w.no})' onkeydown='if(event.key=="Enter")svpick(${w.no})'><span class=av>${w.no}</span><span class=wn>${w.name||'—'}</span><span class=wk>${v?'✓ '+f(v)+' kg':'තවම නැත'}</span></div>`}).join('')||(q?'<p>සේවකයෙකු හමු නොවීය</p>':'<p>සේවකයින් නැත. “+ සේවකයෙකු” ඔබා එක් කරන්න.</p>')}
function svq(v){Q=v;SW=null;MSG='';svres();svent()}
function svpick(n){SW=n;svres();svent();setTimeout(()=>{const k=[...document.querySelectorAll('.sk')],i=k.find(x=>x.value==='')||k[0];i&&i.focus();$('sent').scrollIntoView({behavior:'smooth',block:'nearest'})})}
function svcancel(){SW=null;svres();svent()}
function svlive(){const k=[...document.querySelectorAll('.sk')],s=k.reduce((p,i)=>p+(parseFloat(i.value)||0),0),r=rec(SW),d=+DD.slice(8);$('lt').textContent=f(s);$('mt').textContent=f(ksum(r)-(+(r.dk||{})[d]||0)+s)}
function svnext(i){const k=[...document.querySelectorAll('.sk')],n=k[k.indexOf(i)+1];n?n.focus():svsave()}
function svent(){const e=$('sent');if(!e)return;if(SW==null){e.innerHTML=MSG?`<p class=ok><b>${MSG}</b></p>`:'';return}
 const x=S.w.find(a=>a.no==SW),r=rec(SW),d=+DD.slice(8),dl=(r.dl||{})[d]||[];
 e.innerHTML=`<div class=card style='margin:10px 0;padding:12px;border:2px solid var(--g)'><b>${x.no} - ${x.name}</b><div class=kg3 style='margin-top:8px'>${[0,1,2].map(i=>`<div><label>${i+1} වන වර (kg)</label><input type=number step=any inputmode=decimal class=sk value='${dl[i]??''}' oninput='svlive()' onkeydown='if(event.key=="Enter")svnext(this)'></div>`).join('')}</div><div class=tot><span>අද එකතුව</span><b id=lt>0.00</b></div><small style='color:var(--mut)'>මාසික එකතුව (අද ඇතුළුව): <b id=mt></b> kg</small><div class=da><button class=o onclick='svcancel()'>අවලංගු</button><button onclick='svsave()' style='padding:12px 22px'>සුරකින්න</button></div></div>`;svlive()}
async function svsave(){const x=S.w.find(a=>a.no==SW),d=+DD.slice(8),a=[...document.querySelectorAll('.sk')].map(i=>i.value===''?null:parseFloat(i.value)),s=a.reduce((p,q)=>p+(+q||0),0);
 try{wr(SW,{dl:{[d]:a},dk:{[d]:s}}).catch(e=>toast(e.code));MSG='✓ '+x.name+' සුරැකිණි ('+f(s)+' kg)'+(navigator.onLine?'':' • offline: සම්බන්ධ වූ විට යවයි')}catch(e){MSG='සුරැකීම අසාර්ථකයි: '+e.code}
 navigator.vibrate&&navigator.vibrate(40);SW=null;Q='';const q=$('sq');q.value='';svres();svent();q.focus()}

 $('wk').innerHTML=`<div class=card style='max-width:460px;margin:10px auto'><b>${x.name}</b> (අංකය ${WNO})<p>මාසය: <input type=month value='${pm}' onchange='wm(this.value)'></p><table style='min-width:0'><thead><tr><th>දිනය<th>කිලෝ</tr></thead><tbody>${Object.keys(dk).map(Number).filter(d=>dk[d]>0).sort((a,b)=>a-b).map(d=>`<tr><td class=n>${d}<td>${f(dk[d])}</tr>`).join('')}</tbody><tfoot><tr><td>එකතුව<td>${f(c.k)}</tr></tfoot></table><p>මුළු වැටුප: <b>${f(c.tot)}</b><br>අත්තිකාරම් සහ අඩු කිරීම්: ${f(c.ded)}<br>ශුද්ධ වැටුප: <b>${f(c.net)}</b></p></div>`}
